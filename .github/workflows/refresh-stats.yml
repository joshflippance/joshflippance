name: Refresh README stats

on:
  schedule:
    - cron: '17 11 * * 0'   # Sundays, 11:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh stats
        env:
          GH_TOKEN: ${{ secrets.PROJECT_STATS_TOKEN }}
        run: node scripts/refresh-stats.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh README project stats"
            git push
          else
            echo "No change."
          fi
